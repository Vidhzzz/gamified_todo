<!DOCTYPE html>
<html>
<head>
<title>Gamified Todo</title>
<link rel="stylesheet" href="style.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
</head>

<body>

<div class="container">

<h1>Let's Do It Again</h1>

<div class="stats">

<div class="card">
<h3>Score</h3>
<p id="score">0</p>
</div>

<div class="card">
<h3>Level</h3>
<p id="level">Beginner</p>
</div>

<div class="card">
<h3>Streak 🔥</h3>
<p id="streak">0</p>
</div>

</div>

<!-- Progress bar -->

<div class="progress-container">
<div id="progressBar"></div>
</div>

<div class="task-box">

<input type="text" id="task" placeholder="Enter task">

<input type="number" id="time" placeholder="Minutes">

<button onclick="addTask()">Add Task</button>

</div>

<p id="errorMsg"></p>

<ul id="taskList"></ul>

<h3>🏆 Achievements</h3>
<ul id="achievements"></ul>

<div id="xpPopup"></div>

<script src="script.js"></script>

</body>
</html>
